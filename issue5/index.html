<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>因子研究台 · Issue 5</title>
<style>
:root{color-scheme:light;--ink:#18262e;--muted:#64747d;--line:#dbe2e4;--paper:#fff;--wash:#f2f5f4;--teal:#087f78;--teal2:#34a99a;--red:#d45b55;--gold:#d89b2b;--blue:#487ba8}
*{box-sizing:border-box}body{margin:0;background:var(--wash);color:var(--ink);font:14px/1.5 "Segoe UI","Microsoft YaHei",sans-serif}header{background:#17343a;color:#fff;padding:20px 28px;display:flex;justify-content:space-between;align-items:center;gap:20px;border-bottom:4px solid var(--teal2)}h1{margin:0;font-size:21px;font-weight:650}header p{margin:4px 0 0;color:#c5d3d2;font-size:12px}.meta{font-size:12px;color:#d6e0df;text-align:right}main{max-width:1440px;margin:auto;padding:20px 24px 36px}.controls{display:flex;align-items:end;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:16px}label{font-size:11px;color:var(--muted);display:grid;gap:5px}select,input{font:inherit;border:1px solid #bac7c9;background:#fff;color:var(--ink);border-radius:4px;padding:7px 9px;min-width:142px}.range{display:flex;gap:8px}.range input{min-width:130px}.button{border:0;border-radius:4px;background:var(--teal);color:#fff;padding:8px 12px;font:inherit;cursor:pointer}.button:hover{background:#066861}.stats{display:grid;grid-template-columns:repeat(6,minmax(120px,1fr));border:1px solid var(--line);background:var(--paper);margin-bottom:16px}.stat{padding:12px 14px;border-right:1px solid var(--line)}.stat:last-child{border:0}.stat span{display:block;color:var(--muted);font-size:11px}.stat strong{display:block;font-variant-numeric:tabular-nums;font-size:18px;margin-top:3px;white-space:nowrap}.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}.panel{background:var(--paper);border:1px solid var(--line);min-width:0}.panel header{padding:11px 14px;background:#fff;color:var(--ink);border:0;border-bottom:1px solid var(--line);font-size:13px;font-weight:650}.chart{height:265px;padding:12px 12px 8px}.chart svg{width:100%;height:100%;overflow:visible}.wide{grid-column:1/-1}.table-wrap{overflow:auto;max-height:440px}.table{width:100%;border-collapse:collapse;font-size:12px}.table th,.table td{text-align:right;padding:8px 10px;border-bottom:1px solid #e7ecec;white-space:nowrap;font-variant-numeric:tabular-nums}.table th{position:sticky;top:0;background:#f4f7f6;color:#52636b}.table th:first-child,.table td:first-child{text-align:left}.badge{font-size:10px;border:1px solid #cfdbd9;color:#48615f;border-radius:3px;padding:2px 5px}.notes{margin-top:14px;padding:12px 14px;color:#56666d;background:#e8eeec;border-left:3px solid var(--teal);font-size:11px}.legend{font-size:10px;fill:#64747d}.empty{color:var(--muted);padding:32px;text-align:center}.tip{font-size:11px;color:var(--muted);margin-left:auto}
@media(max-width:900px){main{padding:14px}.stats{grid-template-columns:repeat(3,1fr)}.stat:nth-child(3){border-right:0}.stat:nth-child(-n+3){border-bottom:1px solid var(--line)}.grid{grid-template-columns:1fr}.wide{grid-column:auto}header{padding:16px;align-items:flex-start}.meta{max-width:45%}}
@media(max-width:520px){header{display:block}.meta{text-align:left;margin-top:8px}.stats{grid-template-columns:repeat(2,1fr)}.stat:nth-child(3){border-right:1px solid var(--line)}.stat:nth-child(even){border-right:0}.stat:nth-child(-n+4){border-bottom:1px solid var(--line)}.chart{height:230px}.tip{width:100%;margin-left:0}}
</style>
</head>
<body>
<header><div><h1>因子研究台 <span class="badge">ISSUE 5</span></h1><p>横截面预测能力 · 分组收益 · 滚动稳定性 · 交易摩擦</p></div><div class="meta" id="meta">读取研究结果…</div></header>
<main>
<section class="controls">
<label>因子<select id="factor"></select></label><label>预测周期<select id="horizon"><option value="1d">1日</option><option value="5d">5日</option><option value="20d">20日</option></select></label><label>滚动窗口<select id="window"><option>21</option><option>63</option><option>126</option><option>252</option></select></label>
<label>起始日期<input id="start" type="date"></label><label>结束日期<input id="end" type="date"></label><label>单边成本 (bp)<input id="cost" type="number" min="0" max="100" step="1" value="10"></label><button class="button" id="download">下载当前指标 CSV</button><span class="tip">窗口以交易日计；颜色方向表示因子定义为“值越高越强”</span>
</section>
<section class="stats" id="stats"></section>
<section class="grid">
<div class="panel"><header>RankIC 时间序列</header><div class="chart" id="icChart"></div></div>
<div class="panel"><header>滚动 RankIC / RankICIR</header><div class="chart" id="rollingChart"></div></div>
<div class="panel"><header>五分组未来收益</header><div class="chart" id="quantChart"></div></div>
<div class="panel"><header>因子横截面相关性（最新截面）</header><div class="chart" id="corrChart"></div></div>
<div class="panel"><header>模型诊断：IPCA 风格 / 全局切分树</header><div class="table-wrap"><table class="table" id="models"></table></div></div><div class="panel wide"><header>因子综合评价 <span class="tip">表格展示全样本统计；成本后价差按顶部输入即时重估</span></header><div class="table-wrap"><table class="table" id="summary"></table></div></div>
</section>
<div class="notes" id="notes"></div>
</main>
<script>
const COLORS=['#087f78','#d89b2b','#487ba8','#d45b55','#73858b'];let DATA;
const $=id=>document.getElementById(id);const num=(x,d=3)=>Number.isFinite(+x)?(+x).toFixed(d):'—';const pct=(x,d=2)=>Number.isFinite(+x)?(100*+x).toFixed(d)+'%':'—';
function svgLine(target,series,{zero=false,labels=true}={}){const el=$(target),W=700,H=230,L=48,R=12,T=14,B=28;let all=series.flatMap(s=>s.values.map(p=>p.y).filter(Number.isFinite));if(!all.length){el.innerHTML='<div class="empty">该筛选区间暂无数据</div>';return}let lo=Math.min(...all),hi=Math.max(...all);if(zero){lo=Math.min(lo,0);hi=Math.max(hi,0)}if(hi-lo<1e-8){hi+=.01;lo-=.01}const x=i=>L+i*(W-L-R)/Math.max(series[0].values.length-1,1),y=v=>T+(hi-v)*(H-T-B)/(hi-lo);let grid='';for(let k=0;k<5;k++){let v=lo+(hi-lo)*k/4,yy=y(v);grid+=`<line x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}" stroke="#e5ebea"/><text x="${L-7}" y="${yy+3}" text-anchor="end" class="legend">${num(v,2)}</text>`}if(zero&&lo<0&&hi>0)grid+=`<line x1="${L}" x2="${W-R}" y1="${y(0)}" y2="${y(0)}" stroke="#8a999b" stroke-dasharray="4 4"/>`;let paths=series.map(s=>{let d='',active=false;s.values.forEach((p,i)=>{if(!Number.isFinite(p.y)){active=false;return}d+=(active?'L':'M')+x(i)+' '+y(p.y)+' ';active=true});return `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="1.8"/>`}).join('');let xlabels='';if(labels){const vals=series[0].values,n=4;for(let k=0;k<n;k++){const i=Math.round((vals.length-1)*k/(n-1)),lab=vals[i]?.x||'';xlabels+=`<text x="${x(i)}" y="${H-7}" text-anchor="middle" class="legend">${lab.slice(0,7)}</text>`}}let legends=series.map((s,i)=>`<text x="${L+i*145}" y="10" class="legend" fill="${s.color}">━ ${s.name}</text>`).join('');el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img">${grid}${paths}${xlabels}${legends}</svg>`}
function barChart(target,labels,values,colors){const el=$(target),W=700,H=230,L=48,R=12,T=20,B=35,lo=Math.min(0,...values),hi=Math.max(0,...values),span=hi-lo||1,y=v=>T+(hi-v)*(H-T-B)/span,zero=y(0),slot=(W-L-R)/values.length,bw=slot*.55;let grid='';for(let k=0;k<5;k++){let v=lo+span*k/4,yy=y(v);grid+=`<line x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}" stroke="#e5ebea"/><text x="${L-7}" y="${yy+3}" text-anchor="end" class="legend">${pct(v,1)}</text>`}let bars=values.map((v,i)=>{let yy=y(v),x=L+i*slot+(slot-bw)/2;return `<rect x="${x}" y="${Math.min(yy,zero)}" width="${bw}" height="${Math.max(1,Math.abs(zero-yy))}" fill="${colors[i]}"/><text x="${x+bw/2}" y="${H-13}" text-anchor="middle" class="legend">${labels[i]}</text>`}).join('');el.innerHTML=`<svg viewBox="0 0 ${W} ${H}">${grid}${bars}</svg>`}
function filtered(){const f=$('factor').value,h=$('horizon').value,s=$('start').value,e=$('end').value;return DATA.ic_series.filter(x=>x.factor===f&&x.horizon===h&&(!s||x.date>=s)&&(!e||x.date<=e))}
function rolling(vals,window,key,mode='mean'){return vals.map((p,i)=>{let sub=vals.slice(Math.max(0,i-window+1),i+1).map(x=>x[key]).filter(Number.isFinite);if(sub.length<Math.max(10,Math.ceil(window*.7)))return{x:p.date,y:NaN};let m=sub.reduce((a,b)=>a+b,0)/sub.length,sd=Math.sqrt(sub.reduce((a,b)=>a+(b-m)**2,0)/Math.max(1,sub.length-1));return{x:p.date,y:mode==='mean'?m:(sd?m/sd:NaN)}})}
function render(){const f=$('factor').value,h=$('horizon').value,rows=filtered(),metric=DATA.summary.filter(x=>x.factor===f&&x.horizon===h)[0];if(!metric)return;const win=+$('window').value,cost=+$('cost').value||0;const spread=metric.q5_q1_spread,net=spread-2*cost/10000*metric.avg_daily_turnover;
const cards=[['RankIC 均值',num(metric.rank_ic_mean,4)],['RankICIR',num(metric.rank_icir,3)],['正 RankIC 比例',pct(metric.rank_ic_positive_ratio)],['Q5 − Q1',pct(spread)],['平均日换手',pct(metric.avg_daily_turnover)],['成本后价差估算',pct(net)]];$('stats').innerHTML=cards.map(([a,b])=>`<div class="stat"><span>${a}</span><strong>${b}</strong></div>`).join('');
svgLine('icChart',[{name:'RankIC',color:COLORS[0],values:rows.map(x=>({x:x.date,y:x.rank_ic}))}],{zero:true});
const rm=rolling(rows,win,'rank_ic','mean'),rr=rolling(rows,win,'rank_ic','ir');svgLine('rollingChart',[{name:`${win}日均值`,color:COLORS[0],values:rm},{name:`${win}日RankICIR`,color:COLORS[1],values:rr}],{zero:true});
const q=DATA.quantiles.filter(x=>x.factor===f&&x.horizon===h).sort((a,b)=>a.quantile-b.quantile);barChart('quantChart',q.map(x=>'Q'+x.quantile),q.map(x=>x.mean_return),COLORS);
const cm=DATA.factor_correlation,labels=cm.factors;const el=$('corrChart');let W=700,H=230,cell=Math.min(38,(H-40)/labels.length);let out=`<svg viewBox="0 0 ${W} ${H}">`;labels.forEach((a,i)=>{out+=`<text x="${190+i*cell}" y="${26+i*cell}" class="legend" text-anchor="end">${a}</text>`;labels.forEach((b,j)=>{let v=cm.matrix[i][j],alpha=Math.abs(v),color=v>=0?'8,127,120':'212,91,85';out+=`<rect x="${200+j*cell}" y="${8+i*cell}" width="${cell-2}" height="${cell-2}" fill="rgba(${color},${.12+.75*alpha})"><title>${a} × ${b}: ${num(v,2)}</title></rect><text x="${200+j*cell+cell/2}" y="${23+i*cell}" text-anchor="middle" font-size="8" fill="${alpha>.55?'white':'#233'}">${num(v,1)}</text>`})});out+='</svg>';el.innerHTML=out;
const model=DATA.model_diagnostics||{};const ipca=model.ipca||{},tree=model.pricing_tree||{};const ablation=model.ablation||[];const modelRows=[['IPCA 样本外预测 R²',ipca.oos_predictive_r2],['IPCA 样本外定价拟合 R²',ipca.oos_pricing_r2],['全局切分树样本外预测 R²',tree.oos_predictive_r2],['树首轮切分因子',tree.split_feature]];let mhtml='<thead><tr><th>诊断项</th><th>结果</th></tr></thead><tbody>'+modelRows.map(([a,b])=>`<tr><td>${a}</td><td>${typeof b==='number'?num(b,4):(b||'—')}</td></tr>`).join('');if(ablation.length){mhtml+='<tr><th colspan="2">逐因子删除的样本外边际变化</th></tr>'+ablation.map(x=>`<tr><td>${x.factor}</td><td>IPCA Δ预测R² ${num(x.ipca_delta_predictive_r2,4)} · 树 ΔR² ${num(x.tree_delta_predictive_r2,4)}</td></tr>`).join('')}mhtml+='</tbody>';if(model.protocol)mhtml+=`<caption style="caption-side:bottom;font-size:11px;color:#64747d;padding:6px 10px;text-align:left">${model.protocol.label}：前${Math.round((model.protocol.train_fraction||0)*100)}%训练，测试自 ${model.protocol.test_start} 起，抽样 ${model.protocol.sampled_dates} 日 × ${model.protocol.sampled_assets} 股（步长 ${model.protocol.date_step}）</caption>`;$('models').innerHTML=mhtml;const rowsTable=DATA.summary.filter(x=>x.horizon===h).map(x=>`<tr><td>${x.name}<br><span class="badge">${x.factor}</span></td><td>${num(x.ic_mean,4)}</td><td>${num(x.rank_ic_mean,4)}</td><td>${num(x.rank_icir,2)}</td><td>${pct(x.rank_ic_positive_ratio)}</td><td>${pct(x.q5_q1_spread)}</td><td>${num(x.spread_sharpe_annualized,2)}</td><td>${pct(x.avg_daily_turnover)}</td><td>${pct(x.q5_q1_spread-2*cost/10000*x.avg_daily_turnover)}</td></tr>`).join('');$('summary').innerHTML=`<thead><tr><th>因子</th><th>IC</th><th>RankIC</th><th>RankICIR</th><th>正IC率</th><th>Q5-Q1</th><th>价差Sharpe*</th><th>日换手</th><th>成本后价差**</th></tr></thead><tbody>${rowsTable}</tbody>`;
}
function download(){let h=$('horizon').value,cost=+$('cost').value||0;const rows=DATA.summary.filter(x=>x.horizon===h).map(x=>({...x,net_spread_mean_est:x.q5_q1_spread-2*cost/10000*x.avg_daily_turnover,cost_bps_one_way:cost}));const keys=Object.keys(rows[0]),csv=[keys.join(','),...rows.map(r=>keys.map(k=>JSON.stringify(r[k]??'')).join(','))].join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['﻿'+csv],{type:'text/csv'}));a.download=`factor_metrics_${h}.csv`;a.click();URL.revokeObjectURL(a.href)}
async function init(){try{const r=await fetch('data/dashboard.json');if(!r.ok)throw new Error('找不到 data/dashboard.json，请先运行 analyze.py');DATA=await r.json();$('meta').textContent=`${DATA.meta.start} 至 ${DATA.meta.end} · ${DATA.meta.n_assets.toLocaleString()} 只证券 · ${DATA.meta.n_dates} 个交易日`;$('factor').innerHTML=DATA.factors.map(x=>`<option value="${x.id}">${x.name} (${x.id})</option>`).join('');$('start').value=DATA.meta.start;$('end').value=DATA.meta.end;document.querySelectorAll('select,input').forEach(x=>x.addEventListener('change',render));$('download').onclick=download;$('notes').innerHTML='<b>口径说明</b>：'+DATA.meta.notes.join('　');render()}catch(e){$('meta').textContent='尚无分析结果';document.querySelector('main').insertAdjacentHTML('afterbegin',`<div class="notes">${e.message}</div>`)}}
init();
</script>
</body>
</html>
